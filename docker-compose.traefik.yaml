name: irc
x-logging: &default-logging
  options:
    max-size: '5m'
    max-file: '1'
  driver: json-file

services:
  app:
    image: thelounge/thelounge:latest
    container_name: irc-app
    domainname: ${BASE_DOMAIN_NAME:-example.com}
    hostname: ${BASE_HOST_NAME:-$HOSTNAME}
    restart: always
    pull_policy: always
    logging: *default-logging
    environment:
      TZ: ${TZ:-America/New_York}
      CONTAINER_NAME: irc-app
      HOSTNAME: ${BASE_HOST_NAME:-$HOSTNAME}
    volumes:
      - './volumes/data/irc:/var/opt/thelounge:z'
    depends_on:
      server:
        condition: service_started
    labels:
      - 'traefik.enable=true'
      - 'traefik.docker.network=traefik'
      - 'traefik.http.routers.app.entrypoints=http'
      - 'traefik.http.routers.app.rule=Host(`${BASE_HOST_NAME:-$HOSTNAME}`)'
      - 'traefik.http.routers.app.middlewares=app-https-redirect'
      - 'traefik.http.middlewares.app-https-redirect.redirectscheme.scheme=https'
      - 'traefik.http.routers.app-secure.entrypoints=https'
      - 'traefik.http.routers.app-secure.rule=Host(`${BASE_HOST_NAME:-$HOSTNAME}`)'
      - 'traefik.http.routers.app-secure.tls.certresolver=cloudflare'
      - 'traefik.http.routers.app-secure.service=app'
      - 'traefik.http.services.app.loadbalancer.server.port=9000'
    networks:
      - irc
      - traefik
  server:
    image: linuxserver/ngircd:latest
    container_name: irc-server
    domainname: ${BASE_DOMAIN_NAME:-example.com}
    hostname: ${BASE_HOST_NAME:-$HOSTNAME}
    restart: always
    pull_policy: always
    logging: *default-logging
    environment:
      TZ: ${TZ:-America/New_York}
      CONTAINER_NAME: irc-server
      HOSTNAME: ${BASE_HOST_NAME:-$HOSTNAME}
    volumes:
      - './volumes/config/server:/config:z'
      - '/etc/letsencrypt/archive/domain:/tmp/certs:z'
    networks:
      - irc

  anope:
    image: anope/anope:latest
    container_name: irc-anope
    domainname: ${BASE_DOMAIN_NAME:-example.com}
    hostname: ${BASE_HOST_NAME:-$HOSTNAME}
    restart: always
    pull_policy: always
    logging: *default-logging
    environment:
      TZ: ${TZ:-America/New_York}
      ANOPE_UPLINK_PORT: 6667
      ANOPE_UPLINK_IP: irc-server
      ANOPE_UPLINK_PASSWORD: ${APP_SECRET_KEY:-changeme_uplink_password}
      ANOPE_SERVICES_NAME: ${BASE_HOST_NAME:-$HOSTNAME}
      ANOPE_SERVICES_VHOST: ${BASE_HOST_NAME:-$HOSTNAME}
      CONTAINER_NAME: irc-anope
    volumes:
      - './volumes/data/anope:/data:z'
    depends_on:
      server:
        condition: service_started
    networks:
      - irc

networks:
  irc:
    name: irc
    external: false
  traefik:
    external: true
